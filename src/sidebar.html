<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VoxEdit Sidebar</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
      background: #fafafa;
      color: #333;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Header ── */
    .header {
      background: #e53935;
      color: white;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .header-icon {
      font-size: 18px;
    }

    .header-title {
      font-size: 15px;
      font-weight: 600;
    }

    #close-btn {
      background: none;
      border: none;
      color: white;
      font-size: 20px;
      cursor: pointer;
      line-height: 1;
      padding: 2px 4px;
      border-radius: 3px;
    }

    #close-btn:hover {
      background: rgba(255,255,255,0.2);
    }

    /* ── Selection panel ── */
    .selection-panel {
      padding: 12px 14px;
      background: white;
      border-bottom: 1px solid #e0e0e0;
      flex-shrink: 0;
    }

    .selection-label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      color: #888;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }

    #selection-preview {
      font-size: 13px;
      color: #444;
      font-style: italic;
      min-height: 18px;
      line-height: 1.5;
      max-height: 60px;
      overflow: hidden;
      text-overflow: ellipsis;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
    }

    #selection-preview.empty {
      color: #aaa;
      font-style: normal;
    }

    /* ── Record controls ── */
    .record-panel {
      padding: 12px 14px;
      background: white;
      border-bottom: 1px solid #e0e0e0;
      flex-shrink: 0;
    }

    .record-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    #record-btn {
      flex-shrink: 0;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: none;
      background: #e53935;
      color: white;
      font-size: 18px;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #record-btn:hover {
      background: #c62828;
    }

    #record-btn.recording {
      background: #b71c1c;
      animation: pulse 1s ease-in-out infinite;
    }

    @keyframes pulse {
      0%   { transform: scale(1);    box-shadow: 0 0 0 0 rgba(229,57,53,0.5); }
      70%  { transform: scale(1.05); box-shadow: 0 0 0 8px rgba(229,57,53,0); }
      100% { transform: scale(1);    box-shadow: 0 0 0 0 rgba(229,57,53,0); }
    }

    .record-info {
      flex: 1;
    }

    #record-status {
      font-size: 13px;
      font-weight: 500;
      color: #333;
      margin-bottom: 2px;
    }

    #record-timer {
      font-size: 11px;
      color: #888;
      font-variant-numeric: tabular-nums;
    }

    #attach-btn {
      padding: 8px 14px;
      background: #43a047;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s;
    }

    #attach-btn:hover {
      background: #388e3c;
    }

    #attach-btn:disabled {
      background: #ccc;
      cursor: not-allowed;
    }

    #playback-area {
      margin-top: 10px;
      display: none;
    }

    #playback-area audio {
      width: 100%;
      height: 32px;
    }

    /* ── Annotations list ── */
    .annotations-panel {
      flex: 1;
      overflow-y: auto;
      padding: 10px 14px;
    }

    .section-label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      color: #888;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }

    #annotations-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .annotation-card {
      background: white;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      padding: 10px 12px;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    .annotation-card.highlighted {
      border-color: #e53935;
      box-shadow: 0 0 0 2px rgba(229,57,53,0.2);
    }

    .annotation-card.orphaned {
      border-color: #bdbdbd;
      background: #f5f5f5;
    }

    .card-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 6px;
    }

    .card-text {
      font-size: 12px;
      color: #555;
      font-style: italic;
      line-height: 1.4;
      flex: 1;
    }

    .card-text.orphaned-label {
      color: #999;
    }

    .card-delete {
      background: none;
      border: none;
      color: #bbb;
      cursor: pointer;
      font-size: 14px;
      line-height: 1;
      flex-shrink: 0;
      padding: 2px;
    }

    .card-delete:hover {
      color: #e53935;
    }

    .card-meta {
      font-size: 10px;
      color: #aaa;
      margin-bottom: 6px;
    }

    .card-audio {
      width: 100%;
      height: 30px;
      margin-top: 4px;
    }

    .no-annotations {
      font-size: 13px;
      color: #aaa;
      text-align: center;
      padding: 24px 0;
    }

    /* ── Error toast ── */
    #error-toast {
      display: none;
      position: fixed;
      bottom: 16px;
      left: 16px;
      right: 16px;
      background: #c62828;
      color: white;
      padding: 10px 14px;
      border-radius: 6px;
      font-size: 13px;
      z-index: 9999;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-left">
      <span class="header-icon">🎤</span>
      <span class="header-title">VoxEdit</span>
    </div>
    <button id="close-btn" title="Close sidebar">✕</button>
  </div>

  <div class="selection-panel">
    <div class="selection-label">Selected Text</div>
    <div id="selection-preview" class="empty">Select text in Google Docs to annotate…</div>
  </div>

  <div class="record-panel">
    <div class="record-row">
      <button id="record-btn" title="Start / Stop recording">🎤</button>
      <div class="record-info">
        <div id="record-status">Ready to record</div>
        <div id="record-timer"></div>
      </div>
      <button id="attach-btn" disabled>Attach</button>
    </div>
    <div id="playback-area">
      <audio id="playback-audio" controls></audio>
    </div>
  </div>

  <div class="annotations-panel">
    <div class="section-label">Annotations</div>
    <div id="annotations-list">
      <div class="no-annotations">No annotations yet.</div>
    </div>
  </div>

  <div id="error-toast"></div>

  <script type="module" src="sidebar.js"></script>
</body>
</html>
