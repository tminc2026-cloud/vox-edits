<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VoxEdit</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
      width: 280px;
      min-height: 120px;
      background: #fff;
      color: #333;
    }

    .header {
      background: #e53935;
      color: white;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .header-icon {
      font-size: 20px;
    }

    .header-title {
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 0.3px;
    }

    .body {
      padding: 16px;
    }

    #status {
      font-size: 13px;
      color: #666;
      margin-bottom: 14px;
      min-height: 18px;
    }

    #status.error {
      color: #c62828;
    }

    #status.success {
      color: #2e7d32;
    }

    #toggle-btn {
      display: block;
      width: 100%;
      padding: 10px 0;
      background: #e53935;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s;
    }

    #toggle-btn:hover {
      background: #c62828;
    }

    #toggle-btn:disabled {
      background: #ccc;
      cursor: not-allowed;
    }

    .refresh-hint {
      margin-top: 10px;
      font-size: 12px;
      color: #888;
      line-height: 1.5;
      padding: 8px 10px;
      background: #fafafa;
      border-radius: 4px;
      border: 1px solid #eee;
    }

    .refresh-hint strong {
      color: #555;
    }
  </style>
  <script type="module" src="./popup.js"></script>
</head>
<body>
  <div class="header">
    <span class="header-icon">🎤</span>
    <span class="header-title">VoxEdit</span>
  </div>
  <div class="body">
    <div id="status">Checking connection…</div>
    <button id="toggle-btn" disabled>Open Sidebar</button>
    <div id="refresh-hint" class="refresh-hint" style="display:none">
      <strong>Not connected.</strong><br>
      Please refresh your Google Docs tab after installing VoxEdit.
    </div>
  </div>
</body>
</html>
